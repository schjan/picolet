name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published vulnerability fails govulncheck without a
    # code change; the other jobs skip scheduled runs.
    - cron: "17 6 * * 1"

env:
  BUILD_TAGS: remote,containers_image_openpgp,exclude_graphdriver_btrfs,btrfs_noversion,exclude_graphdriver_devicemapper

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -tags "$BUILD_TAGS" ./... -race -count=1 -timeout 120s

  validate-fleet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate reference fleet
        run: go run -tags "$BUILD_TAGS" ./cmd/picolet validate --repo-dir deploy/fleet-repo

      - name: Check fleet denylist
        # Terms come from the committed .github/fleet-denylist.txt and the
        # FLEET_DENYLIST secret (empty on fork PRs: the file alone applies).
        # Fixed-string, case-insensitive, over file contents and path names.
        # Never print a term: only the paths of files with content matches.
        env:
          FLEET_DENYLIST: ${{ secrets.FLEET_DENYLIST }}
        run: |
          set -u
          terms="$(mktemp)"
          trap 'rm -f "$terms"' EXIT
          { cat .github/fleet-denylist.txt; printf '\n%s\n' "${FLEET_DENYLIST-}"; } \
            | tr -d '\r' \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep -Ev '^(#|$)' > "$terms" || true

          status=0
          rc=0
          grep -rIliF -f "$terms" -- deploy/fleet-repo || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Denylisted term found in the files above (deploy/fleet-repo/)"
            status=1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed (exit $rc)"
            status=1
          fi
          if find deploy/fleet-repo | grep -qiF -f "$terms"; then
            echo "::error::A path name under deploy/fleet-repo/ contains a denylisted term"
            status=1
          fi
          exit "$status"

  e2e:
    # Podman >= 5.2 for Quadlet .build: ubuntu-24.04 images ship 4.9.3 since
    # actions/runner-images#14642; ubuntu-26.04 ships 5.7.0 (preview image).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04-arm
    # Provisioning a user, manager and store per scenario, plus bounded disposal.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Prepare rootless Podman
        run: |
          # Ubuntu may restrict unprivileged user namespaces, which every
          # scenario user's rootless Podman needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          podman version

      # Each scenario runs as its own disposable Linux user (scripts/e2e.sh);
      # the runner user's systemd manager and Podman store stay untouched.
      - name: Run E2E tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
        run: scripts/e2e.sh run

  test-onepassword:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    # Only run on main branch pushes and PRs from the same repo (not forks,
    # not the scheduled govulncheck run)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 1Password integration tests
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_TEST_SECRET_REF: ${{ secrets.OP_TEST_SECRET_REF }}
          OP_TEST_SECTIONED_REF: ${{ secrets.OP_TEST_SECTIONED_REF }}
        run: go test -tags "$BUILD_TAGS,onepassword_integration" ./pkg/onepassword/... -race -count=1 -v

  test-protonpass:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    # Only run on main branch pushes and PRs from the same repo (not forks,
    # not the scheduled govulncheck run)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Proton Pass integration tests
        env:
          PP_PERSONAL_ACCESS_TOKEN: ${{ secrets.PP_PERSONAL_ACCESS_TOKEN }}
          PP_TEST_REF: ${{ secrets.PP_TEST_REF }}
        run: go test -tags "$BUILD_TAGS,protonpass_integration" ./pkg/protonpass/... -race -count=1 -v

  govulncheck:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Latest patch of the go.mod Go version: standard-library findings
          # are fixed by patch releases and are never excluded.
          check-latest: true

      - name: govulncheck
        # Fails on any called vulnerability not listed (with the reason) in
        # .github/govulncheck-exclusions.txt; same as `task vulncheck`.
        run: scripts/govulncheck.sh

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --build-tags "${{ env.BUILD_TAGS }}"
