# GitHub secret scanning / push protection configuration.
#
# testdata/sops/identities holds TEST-ONLY age identities. The SOPS fixture
# corpus (testdata/sops/corpus) is encrypted to them, and they are published on
# purpose, so tests can decrypt the corpus without any real key. Never encrypt
# a real secret to them. Tests that need a dummy age identity elsewhere build
# it at runtime (pkg/sops zeroIdentity) rather than adding a path here.
#
# The two pkg/sops test files below held a literal all-zero dummy identity
# (AGE-SECRET-KEY-1QQQ…) in earlier commits (8ef6563, 078bafc) before
# zeroIdentity replaced it; they are listed so history scanning does not flag
# them. Do not add a key literal to them again.
paths-ignore:
  - "testdata/sops/identities/**"
  - "pkg/sops/inspect_test.go"
  - "pkg/sops/recipient_test.go"
