images:
  nginx: "nginx:1.27"
  exporter: "prom/node-exporter:v1.8"
  app: "myapp:v2.1"
  simple: "docker.io/library/alpine:3.23"
  web-app: "ghcr.io/example/web-app:v1.2.3"
  picolet: "ghcr.io/schjan/picolet:v0.2.0"
ports:
  http: 8080
  metrics: 9090
  app: 3000
  # The Agents' listen ports: a Host without listen_port: in host.yml takes
  # picolet_metrics (user Hosts) or picolet_system_metrics (the rootful Host).
  picolet_metrics: 9417
  picolet_system_metrics: 9418
