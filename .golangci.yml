version: "2"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - exptostd
    - durationcheck
    - embeddedstructfieldcheck
    - exptostd
    - fatcontext
    - forcetypeassert
    - funlen
    - gocritic
    - gosec
    - govet
    - ineffassign
    - ireturn
    - modernize
    - nestif
    - nilnesserr
    - nilnil
    - nolintlint
    - revive
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third-party
  settings:
    depguard:
      # Exactly one rule. An unconfigured depguard denies every non-stdlib
      # import, so the rule is explicit and lax: only the deny list applies.
      rules:
        sops:
          list-mode: lax
          files:
            - $all
            - "!**/pkg/sops/**"
          deny:
            - pkg: github.com/getsops/sops
              desc: "only pkg/sops may import getsops/sops (spec #248); go through pkg/sops"
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - "transport.AuthMethod"
        - "gitpoll.AuthProvider"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra-rules: false
  exclusions:
    generated: lax
    paths:
      - third_party
