version: "3"

vars:
  BINARY: picolet
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  GIT_SHA:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -ldflags "-X github.com/schjan/picolet/pkg/version.Version={{.VERSION}} -X github.com/schjan/picolet/pkg/version.GitSHA={{.GIT_SHA}} -s -w"
  BUILD_TAGS: remote,containers_image_openpgp,exclude_graphdriver_btrfs,btrfs_noversion,exclude_graphdriver_devicemapper
  DEV_DATA_DIR: "{{.ROOT_DIR}}/.picolet-dev"
  DEV_FLEET_DIR: "{{.ROOT_DIR}}/.picolet-dev/fleet"

tasks:
  build:
    desc: Build picolet binary
    cmds:
      - CGO_ENABLED=0 go build -tags "{{.BUILD_TAGS}}" {{.LDFLAGS}} -o {{.BINARY}} ./cmd/picolet

  build-arm64:
    desc: Cross-compile for Raspberry Pi (linux/arm64)
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags "{{.BUILD_TAGS}}" {{.LDFLAGS}} -o {{.BINARY}}-arm64 ./cmd/picolet

  test:
    desc: Run all tests
    cmds:
      - go test -tags "{{.BUILD_TAGS}}" ./... -race -count=1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --build-tags "{{.BUILD_TAGS}}"

  lint:fix:
    desc: Run golangci-lint fix
    cmds:
      - golangci-lint run --build-tags "{{.BUILD_TAGS}}" --fix

  fmt:
    desc: Run all formatters (gofumpt + gci via golangci-lint)
    cmds:
      - golangci-lint fmt

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}} {{.BINARY}}-arm64

  image:
    desc: Build container image for linux/arm64
    cmds:
      - docker buildx build --platform linux/arm64 -t ghcr.io/schjan/picolet:{{.VERSION}} .

  fix:
    desc: Run go fix
    cmds:
      - go fix -tags "{{.BUILD_TAGS}}" ./...

  dev:
    desc: Run one-shot reconciliation from local fleet files (Linux only)
    platforms: [linux]
    cmds:
      - mkdir -p {{.DEV_DATA_DIR}}
      - test -d {{.DEV_FLEET_DIR}} || cp -r testdata/example-fleet {{.DEV_FLEET_DIR}}
      - |
        cat > {{.DEV_DATA_DIR}}/config.yml <<EOF
        hostname: dev-host
        rootless: true
        data_dir: {{.DEV_DATA_DIR}}
        secrets_dir: {{.DEV_FLEET_DIR}}/secrets
        podman_socket: /run/user/$(id -u)/podman/podman.sock
        EOF
      - go run -tags "{{.BUILD_TAGS}}" {{.LDFLAGS}} ./cmd/picolet apply --host dev-host --repo-dir {{.DEV_FLEET_DIR}} --config {{.DEV_DATA_DIR}}/config.yml -v

  dev:teardown:
    desc: Remove all dev resources (Linux only)
    platforms: [linux]
    cmds:
      - go run -tags "{{.BUILD_TAGS}}" ./cmd/picolet down --config {{.DEV_DATA_DIR}}/config.yml 2>/dev/null || true
      - rm -rf {{.DEV_DATA_DIR}}

  dev:logs:
    desc: Follow picolet dev container logs (Linux only)
    platforms: [linux]
    cmds:
      - journalctl --user -u picolet-dev.service -f
