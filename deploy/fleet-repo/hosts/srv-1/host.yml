# Machine srv-1 runs three Hosts (this one, srv-1-system, srv-1-runner). This
# one is the Machine's default user: with no machine: it is on the Machine named
# after its hostname, and with no listen_port: its Agent takes fleet.yml
# ports.picolet_metrics. Replace the hostname with your Machine's name; it must
# match hostname: in the Agent's config (see services/picolet/secrets/).
#
# Host naming convention: see README "Machines, users and ports".
hostname: srv-1
external_hostname: srv-1.example.net
role: rootless
# The metrics stack (Prometheus) runs on this Host only. The proxy and the forge
# share it: the proxy joins forge.network, which exists only in this user's
# Podman. The proxy's ports 80/443 need net.ipv4.ip_unprivileged_port_start=80
# on the Machine (README "Reference bundles: proxy, forge, runner").
features: [metrics, proxy, forge]
user: app
