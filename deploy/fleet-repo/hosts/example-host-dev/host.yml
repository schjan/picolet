# Dev/test host running rootless picolet (role test → services/picolet/).
# Replace with actual hostname — must match hostname: in ~/.config/picolet/config.yml
hostname: example-host-dev
role: test
features: []
# Rootless: the Agent runs as this Linux user and listens on
# fleet.yml ports.picolet_metrics (see README "Machines, users and ports").
user: pi
