base: {}

roles:
  # Rootless Podman, user-level systemd: the Host has user: (srv-1, srv-1-runner)
  rootless:
    services:
      - picolet
  # Rootful Podman, system-level systemd: the Host has no user: (srv-1-system)
  rootful:
    # paths: delivers single files (here: raw systemd units) next to plain
    # bundles. The journal is system-wide, so only the rootful Host trims it.
    paths:
      - systemd/journal-vacuum.timer
      - systemd/journal-vacuum.service
    services:
      - picolet-system

features:
  # Prometheus on Network=host; scrapes the Agents of its Machine and the
  # containers of its own user (see services/metrics/).
  metrics:
    services:
      - metrics
  # Reverse proxy: takes ports 80/443 through proxy.socket (systemd) and
  # publishes no port; it joins the .network of every bundle it routes.
  proxy:
    services:
      - proxy
  # The forge (application, its .network and volumes, config Files). Its public
  # URL is https://<external_hostname of the Host carrying this feature>/, served
  # by the proxy on the same Host.
  forge:
    services:
      - forge
  # A CI runner for the forge, on its own Linux user: jobs get this user's
  # Podman socket, so nothing else may share the user.
  runner:
    services:
      - runner
